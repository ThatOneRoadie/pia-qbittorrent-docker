name: Build on Release

on:
  release:
    types: [published]

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v3

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Login to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # Extract release tag if this is a release event
      - name: Get release tag
        id: release
        run: |
          if [[ "${{ github.event_name }}" == "release" ]]; then
            TAG="${{ github.event.release.tag_name }}"
            # Remove 'v' prefix if present
            DOCKER_TAG="${TAG#v}"
            echo "tag=$DOCKER_TAG" >> $GITHUB_OUTPUT
            echo "is_release=true" >> $GITHUB_OUTPUT
          else
            echo "is_release=false" >> $GITHUB_OUTPUT
          fi

      # Build Ubuntu image
      - name: Build and push Ubuntu image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ./Dockerfile.ubuntu
          platforms: linux/amd64,linux/arm64/v8
          push: true
          tags: |
            ghcr.io/${{ github.repository }}:latest-ubuntu
            ghcr.io/${{ github.repository }}:ubuntu-${{ github.sha }}
            ${{ steps.release.outputs.is_release == 'true' && format('ghcr.io/{0}:{1}-ubuntu', github.repository, steps.release.outputs.tag) || '' }}

      # Build Alpine image
      - name: Build and push Alpine image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ./Dockerfile.alpine
          platforms: linux/amd64,linux/386,linux/arm64,linux/arm/v7,linux/arm/v6
          push: true
          tags: |
            ghcr.io/${{ github.repository }}:latest-alpine
            ghcr.io/${{ github.repository }}:alpine-${{ github.sha }}
            ${{ steps.release.outputs.is_release == 'true' && format('ghcr.io/{0}:{1}-alpine', github.repository, steps.release.outputs.tag) || '' }}

      # Build default image
      - name: Build and push default image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ./Dockerfile
          platforms: linux/amd64,linux/386,linux/arm64,linux/arm/v7,linux/arm/v6
          push: true
          tags: |
            ghcr.io/${{ github.repository }}:latest
            ghcr.io/${{ github.repository }}:${{ github.sha }}
            ${{ steps.release.outputs.is_release == 'true' && format('ghcr.io/{0}:{1}', github.repository, steps.release.outputs.tag) || '' }}
